name = "living-word-map"
main = "worker/index.js"
compatibility_date = "2024-08-01"

# Static site (public/) + Worker API routes
[assets]
directory = "./public"
binding = "ASSETS"

# Set secrets via: wrangler secret put RESEND_API_KEY
# Optional: CAL_WEBHOOK_SECRET, NOTIFY_EMAIL, RESEND_FROM

# Experimental case login + shared People map presence
[[kv_namespaces]]
binding = "EXPERIMENTAL_KV"
id = "bc57f2d4b1c94fa797989141b27156ae"

[vars]
NOTIFY_EMAIL = "repentance101ministry.admin@gmail.com"
RESEND_FROM = "Living Word Map <notifications@repentance101.com>"

# Monday 9:00 AM Eastern (13:00 UTC)
[triggers]
crons = ["0 13 * * 1"]

# Public URL (update DNS CNAME when Cloudflare shows the target after first deploy)
[[routes]]
pattern = "map.repentance101.com"
custom_domain = true

# Large teaching audio lives in R2 (Workers static assets cap files at 25 MiB).
[[r2_buckets]]
binding = "DOWNLOADS"
bucket_name = "living-word-map-downloads"
